<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · AquaTrack</title><link rel="stylesheet" href="/static/farm.css"><script defer src="/static/tooltips.js"></script></head><body class="login-page"><main class="login-card"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">≈</span><span>AquaTrack<small>FISH MONITORING</small></span></a><h1>Welcome to your farm.</h1><p class="muted">Sign in to monitor your tanks live, plan feeding, and review your farm records.</p><form id="loginForm"><label class="field">Username<input id="username" name="username" autocomplete="username" required autofocus></label><label class="field">Password<input id="password" name="password" type="password" autocomplete="current-password" required></label><label class="muted"><input id="showPassword" type="checkbox"> Show password</label><p id="error" class="form-error" role="alert"></p><button id="loginButton" class="button" style="margin-top:20px">Sign in</button></form><p class="login-foot">Need an account or a password reset? Contact your farm administrator.<br>Your farm records are private to you and Admin.</p></main><script>
const form=document.getElementById('loginForm');document.getElementById('showPassword').onchange=e=>document.getElementById('password').type=e.target.checked?'text':'password';
fetch('/api/auth/status').then(r=>r.json()).then(d=>{if(!d.configured)document.getElementById('error').textContent='Sign-in setup is incomplete. Contact your administrator.';}).catch(()=>{});
form.onsubmit=async e=>{e.preventDefault();const button=document.getElementById('loginButton'),error=document.getElementById('error');button.disabled=true;button.textContent='Signing in…';error.textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value,password:form.password.value})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'Unable to sign in.');location.href=data.user.role==='admin'?'/admin':'/user';}catch(err){error.textContent=err.message;button.disabled=false;button.textContent='Sign in';}};
</script></body></html>
